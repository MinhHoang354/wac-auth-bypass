name: Build iOS Tweak dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot build-essential perl libssl-dev unzip

      - name: Tải và Giải nén bộ khung Theos từ tệp ZIP
        run: |
          curl -LO https://github.com
          unzip master.zip
          mv theos-master $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Tải bộ SDK iOS 14.5 (Bắt buộc để biên dịch arm64)
        run: |
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz
          mv iPhoneOS14.5.sdk $HOME/theos/sdks/

      - name: Biên dịch mã nguồn Tweak thành dylib
        run: |
          make package FINALPACKAGE=1 THEOS=$HOME/theos
        env:
          THEOS_DEVICE_IP: localhost

      - name: Tải file dylib thành phẩm lên GitHub (v4)
        uses: actions/upload-artifact@v4
        with:
          name: WACBypass-Dylib
          path: .theos/obj/debug/*.dylib
