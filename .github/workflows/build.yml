name: Build iOS Tweak dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt các công cụ biên dịch Linux thiết yếu
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot build-essential perl libssl-dev git xz-utils curl

      - name: Tải và cấu hình bộ khung cải tiến Theos
        run: |
          git clone --depth 1 https://github.com $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Tải bộ SDK iOS 14.5 chính thức phục vụ kiến trúc arm64
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com -o $HOME/SDK.tar.xz
          tar -xf $HOME/SDK.tar.xz -C $HOME/theos/sdks/

      - name: Tiến hành biên dịch mã nguồn Tweak thành dylib vĩnh viễn
        run: |
          make package FINALPACKAGE=1 THEOS=$HOME/theos
        env:
          THEOS_DEVICE_IP: localhost

      - name: Xuất và tải tệp tin dylib thành phẩm lên GitHub (v4)
        uses: actions/upload-artifact@v4
        with:
          name: WACBypass-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
