name: Build iOS Tweak dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git build-essential perl libssl-dev

      - name: Khởi tạo Theos tự động
        run: |
          git clone --recursive https://github.com $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Biên dịch mã nguồn Tweak thành dylib
        run: |
          $HOME/theos/bin/logify.pl || true
          make package FINALPACKAGE=1
        env:
          THEOS_DEVICE_IP: localhost

      - name: Tải file dylib thành phẩm lên GitHub (v4)
        uses: actions/upload-artifact@v4
        with:
          name: WACBypass-Dylib
          path: .theos/obj/debug/*.dylib
