name: Build iOS Tweak dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo hệ thống biên dịch ezTheos
        uses: sbingner/eztheos@master
        with:
          args: make package FINALPACKAGE=1

      - name: Tải file dylib thành phẩm lên GitHub (v4)
        uses: actions/upload-artifact@v4
        with:
          name: WACBypass-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
