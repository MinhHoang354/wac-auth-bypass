name: Build iOS Tweak dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn dự án
        uses: actions/checkout@v4

      - name: Cài đặt công cụ biên dịch Linux thiết yếu
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot build-essential perl libssl-dev tar xz-utils wget

      - name: Khởi tạo cấu trúc đường dẫn hệ thống
        run: |
          chmod +x bin/* || true
          echo "THEOS=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Tải bộ SDK iOS 14.5 chính thức cho kiến trúc chip arm64
        run: |
          wget --no-check-certificate https://github.com -O SDK.tar.xz
          tar -xf SDK.tar.xz
          mkdir -p sdks
          mv iPhoneOS14.5.sdk sdks/

      - name: Tiến hành biên dịch mã nguồn Tweak thành dylib vĩnh viễn
        run: |
          make package FINALPACKAGE=1
        env:
          THEOS_DEVICE_IP: localhost

      - name: Tải file dylib thành phẩm lên GitHub (v4)
        uses: actions/upload-artifact@v4
        with:
          name: WACBypass-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
