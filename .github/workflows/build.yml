name: Build iOS Tweak dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v3

      - name: Khởi tạo môi trường Theos
        uses: canisterio/setup-theos-action@v1

      - name: Biên dịch mã nguồn Tweak thành dylib
        run: |
          make package FINALPACKAGE=1
        env:
          THEOS_DEVICE_IP: localhost

      - name: Tải file dylib thành phẩm lên GitHub
        uses: actions/upload-artifact@v3
        with:
          name: WACBypass-Dylib
          path: .theos/obj/debug/*.dylib
